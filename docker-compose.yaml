services:
  rendezvous:
    build:
      # The build context is the repository root, because the pnpm lockfile
      # lives there
      context: .
      dockerfile: screensy-rendezvous/Dockerfile
    restart: unless-stopped
    # Optionally set in ".env" (see ".env.example"). Names without a value are
    # only passed when they are set, so the server keeps its defaults otherwise.
    environment:
      - SCREENSY_STUN_URLS
      - SCREENSY_MAX_PRESENTERS
  website:
    build:
      context: .
      dockerfile: screensy-website/Dockerfile
    restart: unless-stopped
  caddy:
    image: "caddy:2.11.7-alpine"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "443:443"
      - "80:80"
  stun:
    image: "coturn/coturn:4.18.0"
    restart: unless-stopped
    # STUN tells a browser the address that its packets come from, so coturn
    # must see them unchanged: through Docker's port forwarding, it would see
    # the forwarder's address. On macOS, the host network of Docker does not
    # reach the tailnet either; run coturn from Homebrew there (see README).
    network_mode: "host"
    # Only STUN, without a configuration file. This also overrides the image's
    # default command, which adds an auto-detected --external-ip.
    command:
      - "-n"
      - "--stun-only"
      - "--listening-port=3478"
      - "--no-tls"
      - "--log-file=stdout"
