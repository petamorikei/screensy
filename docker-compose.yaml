services:
  rendezvous:
    build:
      # The build context is the repository root, because the pnpm lockfile
      # lives there
      context: .
      dockerfile: screensy-rendezvous/Dockerfile
    restart: unless-stopped
    # Optionally set in ".env" (see ".env.example"). Names without a value are
    # only passed when they are set, so the server keeps its defaults otherwise.
    environment:
      - SCREENSY_STUN_URLS
      - SCREENSY_MAX_PRESENTERS
      - SCREENSY_MAX_CAMERAS
  website:
    build:
      context: .
      dockerfile: screensy-website/Dockerfile
    restart: unless-stopped
  caddy:
    image: "caddy:2.11.7-alpine"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "443:443"
      - "80:80"
