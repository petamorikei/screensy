# Set the value below to your public IP address or domain. For a server that
# is only used inside a tailnet, set its Tailscale address (100.x.y.z).
external-ip=localhost

# Set the TURN/STUN server listener port for UDP and TCP.
listening-port=3478

# Accept only temporary usernames that the rendezvous server signs with a
# shared secret (the TURN REST API). The secret is not stored here:
# docker-compose.yaml passes SCREENSY_TURN_SECRET as --static-auth-secret, and
# the rendezvous server reads the same variable.
use-auth-secret

# The realm of the credentials.
realm=screensy

# Do not start TLS client listener since we do not support it. This is not
# dangerous, since even with an unencrypted TURN server, the WebRTC data cannot
# be compromised.
no-tls

# The CLI and the DTLS client listener are off by default in coturn 4.18, so
# they do not need to be disabled here.
